name: PR policy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  issues: read

# #100: label and body edits each fire this workflow; a newer run for the same PR supersedes the older.
concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: One build lane per PR unless labeled cross-lane (plan §20.1)
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-lanes.mjs

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: One new, later-timestamped migration per PR; merged migrations immutable
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-migrations.mjs

  provisional:
    name: provisional
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # #89: the check reads the PR's current body and labels from the API, so a re-run never
    # replays the event payload. Read-only, this repository only.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Questions this PR builds on are answered (COORDINATION.md §6)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-provisional.mjs

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the PR's commits for secrets
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          extra_args: --results=verified,unknown
