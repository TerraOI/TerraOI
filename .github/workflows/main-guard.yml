name: Main guard

# Stopgap while branch protection is unavailable (private repo on GitHub Free).
# Detects commits on main without a merged, reviewed PR (approval from a non-author on the
# final commit; SUPERVISOR_LOGINS exempt; a PR touching a .github/CODEOWNERS path needs that
# approval from a SUPERVISOR_LOGINS reviewer, #63), unverifiable ranges and force-pushes,
# then fails visibly and opens a policy-violation issue. It cannot block the push;
# deploy-staging.yml refuses to deploy such commits. Remove once rulesets are enabled.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # #63: judge a push with the guard and CODEOWNERS as they were BEFORE it, so a merged PR
      # cannot weaken the rule that judges it. Trusting BEFORE is sound only while nothing on main
      # is under an open policy violation: once one is open, every later push fails here, in the
      # shell, until the supervisor resolves and closes it. No pushed code ever decides the verdict.
      # (This workflow file itself still comes from the pushed commit; only branch protection
      # closes that, option (c) in #63.)
      - name: Load the guard and CODEOWNERS from the pre-push commit
        id: trusted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          GUARD_DIR: ${{ runner.temp }}/guard
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label policy-violation --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then echo "state=blocked" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ || "$BEFORE" =~ ^0+$ ]]; then echo "state=unloadable" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p "$GUARD_DIR"
          if git fetch --no-tags --depth=1 origin "$BEFORE" \
            && git show "$BEFORE:scripts/provenance.mjs" > "$GUARD_DIR/provenance.mjs" \
            && git show "$BEFORE:scripts/check-pr-provenance.mjs" > "$GUARD_DIR/check-pr-provenance.mjs" \
            && git show "$BEFORE:.github/CODEOWNERS" > "$GUARD_DIR/CODEOWNERS"; then
            echo "state=trusted" >> "$GITHUB_OUTPUT"
          else
            echo "state=unloadable" >> "$GITHUB_OUTPUT"
          fi
      - name: Every new commit came through a merged PR
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPERVISOR_LOGINS: ${{ vars.SUPERVISOR_LOGINS }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          GUARD_DIR: ${{ runner.temp }}/guard
          STATE: ${{ steps.trusted.outputs.state }}
        run: |
          case "$STATE" in
            trusted)
              # The pre-push list and the pushed list, unioned: a removal never narrows protection.
              CODEOWNERS_PATHS="$GUARD_DIR/CODEOWNERS:.github/CODEOWNERS" node "$GUARD_DIR/check-pr-provenance.mjs" ;;
            blocked)
              # The open issue already records the violation; failing again opens no duplicate.
              echo "::error::A policy-violation issue is open; main stays unverified until the supervisor closes it."
              exit 1 ;;
            *)
              printf 'violations<<EOF\n%s\nEOF\n' "- \`(guard)\`: the guard could not be loaded from the pre-push commit ($BEFORE); no pushed code was run to judge this push" >> "$GITHUB_OUTPUT"
              echo "::error::The pre-push guard could not be loaded; failing closed."
              exit 1 ;;
          esac
      - name: Open a policy-violation issue
        if: failure() && steps.check.outputs.violations != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIOLATIONS: ${{ steps.check.outputs.violations }}
          PUSHER: ${{ github.event.pusher.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create policy-violation --color B60205 \
            --description "Change reached main without the required PR review" --force
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Commits reached \`main\` without a merged pull request approved by a non-author (AGENTS.md section 6)." \
            "$VIOLATIONS" \
            "Pushed by: \`$PUSHER\`. Detected by: $RUN_URL" \
            "Staging deploys stay blocked while this issue is open. Revert the commits or get them reviewed in a PR, then close this issue.")
          gh issue create --title "Policy violation: unreviewed change on main" \
            --label policy-violation --body "$body"
