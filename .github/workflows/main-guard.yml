name: Main guard

# Stopgap while branch protection is unavailable (private repo on GitHub Free).
# Detects commits on main without a merged, reviewed PR (approval from a non-author on the
# final commit; SUPERVISOR_LOGINS exempt; a PR touching a .github/CODEOWNERS path needs that
# approval from a SUPERVISOR_LOGINS reviewer, #63), unverifiable ranges and force-pushes,
# then fails visibly and opens a policy-violation issue. It cannot block the push;
# deploy-staging.yml refuses to deploy such commits. Remove once rulesets are enabled.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # #63: judge a push with the guard and CODEOWNERS as they were BEFORE it, so a merged PR
      # cannot weaken the rule that judges it. (This workflow file itself still comes from the
      # pushed commit; only branch protection can close that, which is option (c) in #63.)
      - name: Load the guard and CODEOWNERS from the pre-push commit
        id: trusted
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          GUARD_DIR: ${{ runner.temp }}/guard
        run: |
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] || { echo "::warning::no pre-push commit"; exit 1; }
          git fetch --no-tags --depth=1 origin "$BEFORE"
          mkdir -p "$GUARD_DIR"
          for f in scripts/provenance.mjs scripts/check-pr-provenance.mjs .github/CODEOWNERS; do
            git show "$BEFORE:$f" > "$GUARD_DIR/$(basename "$f")"
          done
      - name: Every new commit came through a merged PR
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPERVISOR_LOGINS: ${{ vars.SUPERVISOR_LOGINS }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          GUARD_DIR: ${{ runner.temp }}/guard
          TRUSTED: ${{ steps.trusted.outcome }}
        run: |
          if [ "$TRUSTED" = "success" ]; then
            # The pre-push list and the pushed list, unioned: a removal never narrows protection.
            CODEOWNERS_PATHS="$GUARD_DIR/CODEOWNERS:.github/CODEOWNERS" node "$GUARD_DIR/check-pr-provenance.mjs"
          else
            TRUSTED_GUARD=false node scripts/check-pr-provenance.mjs
          fi
      - name: Open a policy-violation issue
        if: failure() && steps.check.outputs.violations != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIOLATIONS: ${{ steps.check.outputs.violations }}
          PUSHER: ${{ github.event.pusher.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create policy-violation --color B60205 \
            --description "Change reached main without the required PR review" --force
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Commits reached \`main\` without a merged pull request approved by a non-author (AGENTS.md section 6)." \
            "$VIOLATIONS" \
            "Pushed by: \`$PUSHER\`. Detected by: $RUN_URL" \
            "Staging deploys stay blocked while this issue is open. Revert the commits or get them reviewed in a PR, then close this issue.")
          gh issue create --title "Policy violation: unreviewed change on main" \
            --label policy-violation --body "$body"
