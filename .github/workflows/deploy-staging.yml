name: Deploy staging

# Deploys main to the isolated staging environment (plan §17.2).
# Skips cleanly until T-004 (human-only) adds the staging secrets and routes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
    steps:
      - name: Check staging is configured
        id: gate
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::notice::Staging secret $v is not set (T-004). Skipping deploy."
              echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Refuse commits that skipped PR review (stopgap for branch protection)
        if: steps.gate.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHAS: ${{ github.sha }}
        run: node scripts/check-pr-provenance.mjs
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Apply migrations to staging (compatible changes first, plan §17.2)
        if: steps.gate.outputs.ready == 'true'
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase db push --yes
      - name: Build Workers bundle
        if: steps.gate.outputs.ready == 'true'
        run: pnpm cf:build
      - name: Deploy to Cloudflare (staging env)
        if: steps.gate.outputs.ready == 'true'
        run: pnpm exec wrangler deploy --env staging
